name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable tag to publish
        required: true
        type: string

permissions: {}

jobs:
  publish:
    permissions:
      actions: read
      contents: write
    uses: abmcar/FarmTogether2-ModKit/.github/workflows/reusable-mod-publish.yml@0123456789abcdef0123456789abcdef01234567
    with:
      tag: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      modkit-commit: 0123456789abcdef0123456789abcdef01234567