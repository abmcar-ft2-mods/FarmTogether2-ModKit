name: Reusable mod publish

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      modkit-commit:
        required: true
        type: string
    secrets:
      modkit_read_token:
        required: true

permissions: {}

concurrency:
  group: reusable-mod-publish-${{ github.repository }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: windows-2025
    permissions:
      actions: read
      contents: read
    outputs:
      tag: ${{ steps.evidence.outputs.tag }}
      tag-object: ${{ steps.evidence.outputs.tag-object }}
      commit: ${{ steps.evidence.outputs.commit }}
      workflow-id: ${{ steps.evidence.outputs.workflow-id }}
      run-id: ${{ steps.evidence.outputs.run-id }}
      artifact-id: ${{ steps.evidence.outputs.artifact-id }}
      artifact-name: ${{ steps.evidence.outputs.artifact-name }}
      artifact-digest: ${{ steps.evidence.outputs.artifact-digest }}
    steps:
      - name: Validate caller event and stable tag
        id: request
        shell: pwsh
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          MODKIT_COMMIT: ${{ inputs.modkit-commit }}
          CALLER_EVENT: ${{ github.event_name }}
          CALLER_REF: ${{ github.ref }}
        run: |
          if ($env:REQUESTED_TAG -cnotmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw 'tag must be a strict stable vMAJOR.MINOR.PATCH tag.'
          }
          if ($env:MODKIT_COMMIT -cnotmatch '^[0-9a-f]{40}$') {
            throw 'modkit-commit must be lowercase 40-hex.'
          }
          $validCaller =
            ($env:CALLER_EVENT -ceq 'push' -and $env:CALLER_REF -ceq "refs/tags/$env:REQUESTED_TAG") -or
            $env:CALLER_EVENT -ceq 'workflow_dispatch'
          if (-not $validCaller) {
            throw 'Reusable publish accepts only its tag push or workflow_dispatch recovery.'
          }
          "tag=$env:REQUESTED_TAG" >> $env:GITHUB_OUTPUT
      - name: Check out caller at requested tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ steps.request.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check out locked ModKit bootstrap
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: abmcar/FarmTogether2-ModKit
          ref: ${{ inputs.modkit-commit }}
          token: ${{ secrets.modkit_read_token }}
          path: .modkit/bootstrap
          persist-credentials: false
      - name: Set up locked .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - name: Assert exact .NET SDK
        shell: pwsh
        run: |
          $requiredVersion = (Get-Content -LiteralPath 'global.json' -Raw | ConvertFrom-Json).sdk.version
          if ((dotnet --version).Trim() -cne $requiredVersion) {
            throw "Exact .NET SDK $requiredVersion is required."
          }
      - name: Parse annotated candidate evidence
        id: evidence
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ steps.request.outputs.tag }}
          MODKIT_COMMIT: ${{ inputs.modkit-commit }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $lock = Get-Content -LiteralPath 'modkit.lock.json' -Raw | ConvertFrom-Json
          if ([string]$lock.workflowCommit -cne $env:MODKIT_COMMIT) {
            throw 'modkit.lock.json workflowCommit differs from modkit-commit.'
          }
          $bootstrapHead = @(& git -C '.modkit/bootstrap' rev-parse HEAD)
          if ($LASTEXITCODE -ne 0 -or $bootstrapHead.Count -ne 1 -or $bootstrapHead[0].Trim() -cne $env:MODKIT_COMMIT) {
            throw 'ModKit bootstrap checkout differs from modkit-commit.'
          }
          $tagRef = "refs/tags/$env:REQUESTED_TAG"
          $tagType = @(& git cat-file -t $tagRef)
          if ($LASTEXITCODE -ne 0 -or $tagType.Count -ne 1 -or $tagType[0].Trim() -cne 'tag') {
            throw 'Release tag must be annotated.'
          }
          $tagObject = @(& git rev-parse $tagRef)
          if ($LASTEXITCODE -ne 0 -or $tagObject.Count -ne 1 -or $tagObject[0].Trim() -cnotmatch '^[0-9a-f]{40}$') {
            throw 'Release tag object is invalid.'
          }
          $tagObject = $tagObject[0].Trim()
          $commit = @(& git rev-parse "$env:REQUESTED_TAG^{}")
          if ($LASTEXITCODE -ne 0 -or $commit.Count -ne 1 -or $commit[0].Trim() -cnotmatch '^[0-9a-f]{40}$') {
            throw 'Release tag did not peel to one commit.'
          }
          $commit = $commit[0].Trim()
          $head = @(& git rev-parse HEAD)
          if ($LASTEXITCODE -ne 0 -or $head.Count -ne 1 -or $head[0].Trim() -cne $commit) {
            throw 'Caller checkout is not the peeled tag commit.'
          }
          $remoteRef = @(& gh api --method GET "repos/$env:REPOSITORY/git/ref/tags/$env:REQUESTED_TAG") -join "`n" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or [string]$remoteRef.ref -cne $tagRef -or
              [string]$remoteRef.object.type -cne 'tag' -or [string]$remoteRef.object.sha -cne $tagObject) {
            throw 'Remote annotated tag identity differs from the checked out tag.'
          }
          $mod = Get-Content -LiteralPath 'mod.json' -Raw | ConvertFrom-Json
          if ($env:REQUESTED_TAG -cne "v$([string]$mod.version)") {
            throw 'Release tag differs from mod.json version.'
          }
          $expectedArtifactName = "$([string]$mod.assemblyName)-candidate-$commit"
          $message = @(& git for-each-ref '--format=%(contents)' $tagRef) -join "`n"
          if ($LASTEXITCODE -ne 0) { throw 'Could not read annotated tag contents.' }
          $lines = @($message -split "`r?`n" | Where-Object { $_ -cmatch '^Candidate-' })
          if ($lines.Count -ne 4) { throw 'Annotated tag must contain exactly four candidate evidence fields.' }
          function Read-Field([string]$Pattern, [string]$Label) {
            $matches = @($lines | ForEach-Object { [regex]::Match($_, $Pattern) } | Where-Object Success)
            if ($matches.Count -ne 1) { throw "Annotated tag must contain exactly one valid $Label field." }
            return $matches[0].Groups[1].Value
          }
          $runText = Read-Field '^Candidate-Run-Id: ([1-9][0-9]*)$' 'Candidate-Run-Id'
          $artifactText = Read-Field '^Candidate-Artifact-Id: ([1-9][0-9]*)$' 'Candidate-Artifact-Id'
          $artifactName = Read-Field '^Candidate-Artifact-Name: ([A-Za-z_][A-Za-z0-9_.]*-candidate-[0-9a-f]{40})$' 'Candidate-Artifact-Name'
          $digest = Read-Field '^Candidate-Artifact-Digest: (sha256:[0-9a-f]{64})$' 'Candidate-Artifact-Digest'
          $runId = [long]::Parse($runText, [Globalization.CultureInfo]::InvariantCulture)
          $artifactId = [long]::Parse($artifactText, [Globalization.CultureInfo]::InvariantCulture)
          if ($artifactName -cne $expectedArtifactName) { throw 'Candidate artifact name differs from mod identity and tag commit.' }
          $workflow = @(& gh api --method GET "repos/$env:REPOSITORY/actions/workflows/ci.yml") -join "`n"
          if ($LASTEXITCODE -ne 0) { throw 'Candidate CI workflow query failed.' }
          $workflow = $workflow | ConvertFrom-Json
          if ([long]$workflow.id -le 0 -or [string]$workflow.path -cne '.github/workflows/ci.yml' -or
              [string]$workflow.state -cne 'active') {
            throw 'Candidate CI workflow identity is invalid.'
          }
          $run = @(& gh api --method GET "repos/$env:REPOSITORY/actions/runs/$runId") -join "`n"
          if ($LASTEXITCODE -ne 0) { throw 'Candidate workflow run query failed.' }
          $run = $run | ConvertFrom-Json
          if ([long]$run.id -ne $runId -or [string]$run.event -cne 'push' -or
              [string]$run.head_branch -cne 'main' -or [string]$run.head_sha -cne $commit -or
              [string]$run.status -cne 'completed' -or [string]$run.conclusion -cne 'success' -or
              [long]$run.workflow_id -ne [long]$workflow.id -or
              [string]$run.path -cne '.github/workflows/ci.yml') {
            throw 'Candidate run is not a successful main push for the tag commit.'
          }
          $artifact = @(& gh api --method GET "repos/$env:REPOSITORY/actions/artifacts/$artifactId") -join "`n"
          if ($LASTEXITCODE -ne 0) { throw 'Candidate artifact query failed.' }
          $artifact = $artifact | ConvertFrom-Json
          if ([long]$artifact.id -ne $artifactId -or [string]$artifact.name -cne $artifactName -or
              [string]$artifact.digest -cne $digest -or [bool]$artifact.expired -or
              [long]$artifact.workflow_run.id -ne $runId -or [string]$artifact.workflow_run.head_sha -cne $commit) {
            throw 'Candidate artifact metadata differs from annotated tag evidence.'
          }
          "tag=$env:REQUESTED_TAG" >> $env:GITHUB_OUTPUT
          "tag-object=$tagObject" >> $env:GITHUB_OUTPUT
          "commit=$commit" >> $env:GITHUB_OUTPUT
          "workflow-id=$([long]$workflow.id)" >> $env:GITHUB_OUTPUT
          "run-id=$runId" >> $env:GITHUB_OUTPUT
          "artifact-id=$artifactId" >> $env:GITHUB_OUTPUT
          "artifact-name=$artifactName" >> $env:GITHUB_OUTPUT
          "artifact-digest=$digest" >> $env:GITHUB_OUTPUT
      - name: Resolve locked ModKit package and tooling
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.modkit_read_token }}
        run: |
          & gh auth setup-git --hostname github.com
          if ($LASTEXITCODE -ne 0) {
            throw "ModKit Git authentication setup failed with exit code $LASTEXITCODE."
          }
          & '.modkit/bootstrap/scripts/Resolve-ModKit.ps1' `
            -LockFile 'modkit.lock.json' `
            -Destination '.modkit/packages' `
            -PropsOutput '.modkit/generated/ModKit.lock.props'
          if ($LASTEXITCODE -ne 0) {
            throw "ModKit resolver failed with exit code $LASTEXITCODE."
          }
      - name: Verify locked package and detached tooling
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $lock = Get-Content -LiteralPath 'modkit.lock.json' -Raw | ConvertFrom-Json
          $packages = @(Get-ChildItem -LiteralPath '.modkit/packages' -File -Force)
          if ($packages.Count -ne 1 -or $packages[0].Name -cne [string]$lock.assetName -or
              (Get-FileHash -LiteralPath $packages[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant() -cne [string]$lock.sha256) {
            throw 'Resolved package identity or SHA-256 differs from modkit.lock.json.'
          }
          $head = @(& git -C '.modkit/tooling' rev-parse HEAD)
          if ($LASTEXITCODE -ne 0 -or $head.Count -ne 1 -or $head[0].Trim() -cne [string]$lock.workflowCommit) {
            throw 'Resolved tooling HEAD differs from modkit.lock.json.'
          }
          $branch = @(& git -C '.modkit/tooling' rev-parse --abbrev-ref HEAD)
          if ($LASTEXITCODE -ne 0 -or $branch.Count -ne 1 -or $branch[0].Trim() -cne 'HEAD') {
            throw 'Resolved tooling checkout is not detached.'
          }
      - name: Receive and validate frozen candidate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_COMMIT: ${{ steps.evidence.outputs.commit }}
          EXPECTED_RUN_ID: ${{ steps.evidence.outputs.run-id }}
          EXPECTED_ARTIFACT_ID: ${{ steps.evidence.outputs.artifact-id }}
          EXPECTED_ARTIFACT_NAME: ${{ steps.evidence.outputs.artifact-name }}
          EXPECTED_ARTIFACT_DIGEST: ${{ steps.evidence.outputs.artifact-digest }}
          REPOSITORY: ${{ github.repository }}
        run: |
          New-Item -ItemType Directory -Path 'artifacts/verify-evidence' | Out-Null
          & '.modkit/tooling/scripts/Receive-VerifiedArtifact.ps1' `
            -Repository $env:REPOSITORY `
            -ArtifactId $env:EXPECTED_ARTIFACT_ID `
            -ExpectedArtifactName $env:EXPECTED_ARTIFACT_NAME `
            -ExpectedRunId $env:EXPECTED_RUN_ID `
            -ExpectedCommit $env:EXPECTED_COMMIT `
            -ExpectedDigest $env:EXPECTED_ARTIFACT_DIGEST `
            -ArchivePath 'artifacts/verify-evidence/candidate.zip' `
            -DestinationDirectory 'artifacts/verify-candidate'
          if ($LASTEXITCODE -ne 0) { throw "Candidate receiver failed with exit code $LASTEXITCODE." }
          & '.modkit/tooling/scripts/Test-Candidate.ps1' `
            -CandidateDirectory 'artifacts/verify-candidate' `
            -ExpectedCommit $env:EXPECTED_COMMIT `
            -ExpectedRunId $env:EXPECTED_RUN_ID `
            -ExpectedArtifactName $env:EXPECTED_ARTIFACT_NAME `
            -CandidateKind Mod
          if ($LASTEXITCODE -ne 0) { throw "Candidate verification failed with exit code $LASTEXITCODE." }
      - name: Rebuild and compare candidate assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path 'artifacts/rebuild-parent' | Out-Null
          & '.modkit/tooling/scripts/Invoke-ModBuild.ps1' `
            -RepositoryRoot '.' -GameApiMode Hosted -Configuration Release
          if ($LASTEXITCODE -ne 0) { throw "Independent rebuild failed with exit code $LASTEXITCODE." }
          & '.modkit/tooling/scripts/Pack-Mod.ps1' `
            -RepositoryRoot '.' -Configuration Release -OutputDirectory 'artifacts/rebuild'
          if ($LASTEXITCODE -ne 0) { throw "Independent repack failed with exit code $LASTEXITCODE." }
          & '.modkit/tooling/scripts/Test-PublishedAssets.ps1' `
            -PublishedDirectory 'artifacts/rebuild' `
            -CandidateDirectory 'artifacts/verify-candidate' `
            -CandidateKind Mod
          if ($LASTEXITCODE -ne 0) { throw "Rebuilt assets differ from the frozen candidate: $LASTEXITCODE." }

  publish:
    needs: verify
    runs-on: windows-2025
    permissions:
      actions: read
      attestations: read
      contents: write
    steps:
      - name: Validate recovery identity
        id: request
        shell: pwsh
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          VERIFIED_TAG: ${{ needs.verify.outputs.tag }}
          MODKIT_COMMIT: ${{ inputs.modkit-commit }}
        run: |
          if ($env:REQUESTED_TAG -cne $env:VERIFIED_TAG -or
              $env:REQUESTED_TAG -cnotmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' -or
              $env:MODKIT_COMMIT -cnotmatch '^[0-9a-f]{40}$') {
            throw 'Publish identity differs from verified stable request.'
          }
          "tag=$env:REQUESTED_TAG" >> $env:GITHUB_OUTPUT
      - name: Check out caller at verified tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ steps.request.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check out locked ModKit bootstrap
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: abmcar/FarmTogether2-ModKit
          ref: ${{ inputs.modkit-commit }}
          token: ${{ secrets.modkit_read_token }}
          path: .modkit/bootstrap
          persist-credentials: false
      - name: Set up locked .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - name: Assert exact .NET SDK
        shell: pwsh
        run: |
          $requiredVersion = (Get-Content -LiteralPath 'global.json' -Raw | ConvertFrom-Json).sdk.version
          if ((dotnet --version).Trim() -cne $requiredVersion) {
            throw "Exact .NET SDK $requiredVersion is required."
          }
      - name: Re-query frozen candidate evidence
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ steps.request.outputs.tag }}
          MODKIT_COMMIT: ${{ inputs.modkit-commit }}
          EXPECTED_TAG_OBJECT: ${{ needs.verify.outputs.tag-object }}
          EXPECTED_COMMIT: ${{ needs.verify.outputs.commit }}
          EXPECTED_WORKFLOW_ID: ${{ needs.verify.outputs.workflow-id }}
          EXPECTED_RUN_ID: ${{ needs.verify.outputs.run-id }}
          EXPECTED_ARTIFACT_ID: ${{ needs.verify.outputs.artifact-id }}
          EXPECTED_ARTIFACT_NAME: ${{ needs.verify.outputs.artifact-name }}
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.verify.outputs.artifact-digest }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $lock = Get-Content -LiteralPath 'modkit.lock.json' -Raw | ConvertFrom-Json
          if ([string]$lock.workflowCommit -cne $env:MODKIT_COMMIT) { throw 'Publish lock differs from modkit-commit.' }
          $bootstrapHead = @(& git -C '.modkit/bootstrap' rev-parse HEAD)
          if ($LASTEXITCODE -ne 0 -or $bootstrapHead.Count -ne 1 -or $bootstrapHead[0].Trim() -cne $env:MODKIT_COMMIT) {
            throw 'Publish bootstrap checkout differs from modkit-commit.'
          }
          $tagRef = "refs/tags/$env:REQUESTED_TAG"
          $tagType = @(& git cat-file -t $tagRef)
          if ($LASTEXITCODE -ne 0 -or $tagType.Count -ne 1 -or $tagType[0].Trim() -cne 'tag') { throw 'Publish tag is not annotated.' }
          $tagObject = @(& git rev-parse $tagRef)
          if ($LASTEXITCODE -ne 0 -or $tagObject.Count -ne 1 -or $tagObject[0].Trim() -cne $env:EXPECTED_TAG_OBJECT) {
            throw 'Publish tag object differs from verified tag object.'
          }
          $commit = @(& git rev-parse "$env:REQUESTED_TAG^{}")
          if ($LASTEXITCODE -ne 0 -or $commit.Count -ne 1 -or $commit[0].Trim() -cne $env:EXPECTED_COMMIT) {
            throw 'Publish tag commit differs from verified commit.'
          }
          $head = @(& git rev-parse HEAD)
          if ($LASTEXITCODE -ne 0 -or $head.Count -ne 1 -or $head[0].Trim() -cne $env:EXPECTED_COMMIT) {
            throw 'Publish checkout differs from verified commit.'
          }
          $remoteRef = @(& gh api --method GET "repos/$env:REPOSITORY/git/ref/tags/$env:REQUESTED_TAG") -join "`n" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or [string]$remoteRef.ref -cne $tagRef -or
              [string]$remoteRef.object.type -cne 'tag' -or [string]$remoteRef.object.sha -cne $env:EXPECTED_TAG_OBJECT) {
            throw 'Publish remote tag identity differs from verified tag.'
          }
          $mod = Get-Content -LiteralPath 'mod.json' -Raw | ConvertFrom-Json
          if ($env:REQUESTED_TAG -cne "v$([string]$mod.version)" -or
              $env:EXPECTED_ARTIFACT_NAME -cne "$([string]$mod.assemblyName)-candidate-$env:EXPECTED_COMMIT") {
            throw 'Publish tag or candidate name differs from mod identity.'
          }
          $message = @(& git for-each-ref '--format=%(contents)' $tagRef) -join "`n"
          if ($LASTEXITCODE -ne 0) { throw 'Could not reread annotated tag contents.' }
          $expectedLines = @(
            "Candidate-Run-Id: $env:EXPECTED_RUN_ID",
            "Candidate-Artifact-Id: $env:EXPECTED_ARTIFACT_ID",
            "Candidate-Artifact-Name: $env:EXPECTED_ARTIFACT_NAME",
            "Candidate-Artifact-Digest: $env:EXPECTED_ARTIFACT_DIGEST")
          $candidateLines = @($message -split "`r?`n" | Where-Object { $_ -cmatch '^Candidate-' })
          if ($candidateLines.Count -ne 4 -or @(Compare-Object $expectedLines $candidateLines -CaseSensitive).Count -ne 0) {
            throw 'Publish annotated evidence differs from verified evidence.'
          }
          if ($env:EXPECTED_WORKFLOW_ID -cnotmatch '^[1-9][0-9]*$') { throw 'Verified candidate CI workflow id is invalid.' }
          $expectedWorkflowId = [long]::Parse($env:EXPECTED_WORKFLOW_ID, [Globalization.CultureInfo]::InvariantCulture)
          $workflow = @(& gh api --method GET "repos/$env:REPOSITORY/actions/workflows/$expectedWorkflowId") -join "`n" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or [long]$workflow.id -ne $expectedWorkflowId -or
              [string]$workflow.path -cne '.github/workflows/ci.yml' -or [string]$workflow.state -cne 'active') {
            throw 'Publish candidate CI workflow identity differs from verified evidence.'
          }
          $run = @(& gh api --method GET "repos/$env:REPOSITORY/actions/runs/$env:EXPECTED_RUN_ID") -join "`n" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or [long]$run.id -ne [long]$env:EXPECTED_RUN_ID -or
              [string]$run.event -cne 'push' -or [string]$run.head_branch -cne 'main' -or
              [string]$run.head_sha -cne $env:EXPECTED_COMMIT -or [string]$run.status -cne 'completed' -or
              [string]$run.conclusion -cne 'success' -or [long]$run.workflow_id -ne $expectedWorkflowId -or
              [string]$run.path -cne '.github/workflows/ci.yml') {
            throw 'Publish candidate run query differs from verified evidence.'
          }
          $artifact = @(& gh api --method GET "repos/$env:REPOSITORY/actions/artifacts/$env:EXPECTED_ARTIFACT_ID") -join "`n" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or [long]$artifact.id -ne [long]$env:EXPECTED_ARTIFACT_ID -or
              [string]$artifact.name -cne $env:EXPECTED_ARTIFACT_NAME -or
              [string]$artifact.digest -cne $env:EXPECTED_ARTIFACT_DIGEST -or [bool]$artifact.expired -or
              [long]$artifact.workflow_run.id -ne [long]$env:EXPECTED_RUN_ID -or
              [string]$artifact.workflow_run.head_sha -cne $env:EXPECTED_COMMIT) {
            throw 'Publish artifact query differs from verified evidence.'
          }
      - name: Resolve locked ModKit package and tooling
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.modkit_read_token }}
        run: |
          & gh auth setup-git --hostname github.com
          if ($LASTEXITCODE -ne 0) {
            throw "ModKit Git authentication setup failed with exit code $LASTEXITCODE."
          }
          & '.modkit/bootstrap/scripts/Resolve-ModKit.ps1' `
            -LockFile 'modkit.lock.json' `
            -Destination '.modkit/packages' `
            -PropsOutput '.modkit/generated/ModKit.lock.props'
          if ($LASTEXITCODE -ne 0) { throw "ModKit resolver failed with exit code $LASTEXITCODE." }
      - name: Verify locked package and detached tooling
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $lock = Get-Content -LiteralPath 'modkit.lock.json' -Raw | ConvertFrom-Json
          $packages = @(Get-ChildItem -LiteralPath '.modkit/packages' -File -Force)
          if ($packages.Count -ne 1 -or $packages[0].Name -cne [string]$lock.assetName -or
              (Get-FileHash -LiteralPath $packages[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant() -cne [string]$lock.sha256) {
            throw 'Publish package identity or SHA-256 differs from modkit.lock.json.'
          }
          $head = @(& git -C '.modkit/tooling' rev-parse HEAD)
          if ($LASTEXITCODE -ne 0 -or $head.Count -ne 1 -or $head[0].Trim() -cne [string]$lock.workflowCommit) {
            throw 'Publish tooling HEAD differs from modkit.lock.json.'
          }
          $branch = @(& git -C '.modkit/tooling' rev-parse --abbrev-ref HEAD)
          if ($LASTEXITCODE -ne 0 -or $branch.Count -ne 1 -or $branch[0].Trim() -cne 'HEAD') {
            throw 'Publish tooling checkout is not detached.'
          }
      - name: Receive and validate frozen candidate again
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_COMMIT: ${{ needs.verify.outputs.commit }}
          EXPECTED_RUN_ID: ${{ needs.verify.outputs.run-id }}
          EXPECTED_ARTIFACT_ID: ${{ needs.verify.outputs.artifact-id }}
          EXPECTED_ARTIFACT_NAME: ${{ needs.verify.outputs.artifact-name }}
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.verify.outputs.artifact-digest }}
          REPOSITORY: ${{ github.repository }}
        run: |
          New-Item -ItemType Directory -Path 'artifacts/publish-evidence' | Out-Null
          & '.modkit/tooling/scripts/Receive-VerifiedArtifact.ps1' `
            -Repository $env:REPOSITORY `
            -ArtifactId $env:EXPECTED_ARTIFACT_ID `
            -ExpectedArtifactName $env:EXPECTED_ARTIFACT_NAME `
            -ExpectedRunId $env:EXPECTED_RUN_ID `
            -ExpectedCommit $env:EXPECTED_COMMIT `
            -ExpectedDigest $env:EXPECTED_ARTIFACT_DIGEST `
            -ArchivePath 'artifacts/publish-evidence/candidate.zip' `
            -DestinationDirectory 'artifacts/publish-candidate'
          if ($LASTEXITCODE -ne 0) { throw "Candidate receiver failed with exit code $LASTEXITCODE." }
          & '.modkit/tooling/scripts/Test-Candidate.ps1' `
            -CandidateDirectory 'artifacts/publish-candidate' `
            -ExpectedCommit $env:EXPECTED_COMMIT `
            -ExpectedRunId $env:EXPECTED_RUN_ID `
            -ExpectedArtifactName $env:EXPECTED_ARTIFACT_NAME `
            -CandidateKind Mod
          if ($LASTEXITCODE -ne 0) { throw "Candidate verification failed with exit code $LASTEXITCODE." }
      - name: Create or resume verified draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          EXPECTED_TAG_OBJECT: ${{ needs.verify.outputs.tag-object }}
          EXPECTED_COMMIT: ${{ needs.verify.outputs.commit }}
          REPOSITORY: ${{ github.repository }}
        run: |
          & '.modkit/tooling/scripts/Publish-VerifiedRelease.ps1' `
            -Repository $env:REPOSITORY `
            -ReleaseTag $env:RELEASE_TAG `
            -ExpectedTagObject $env:EXPECTED_TAG_OBJECT `
            -ExpectedCommit $env:EXPECTED_COMMIT `
            -CandidateDirectory 'artifacts/publish-candidate' `
            -CandidateKind Mod `
            -WorkingDirectory 'artifacts/release-publication'
